[project]
name = "artisan-assets"
version = "0.1.0"
description = "Blueprint-driven articulated asset generation with independent physical and visual review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Artisan contributors" }]
dependencies = [
