[project.optional-dependencies]
usd = ["usd-core==26.5"]

[project.scripts]
artisan = "artisan.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.uv]
environments = ['sys_platform == "linux" and python_version == "3.12"']
constraint-dependencies = [
    "packaging==26.2",
    "pygments==2.20.0",
    "ruff==0.15.12",
    "filelock==3.25.2",
    "ftfy==6.3.1",
    "hf-xet==1.4.2",
    "huggingface-hub==0.36.2",
    "jinja2==3.1.6",
    "lazy-loader==0.5",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "regex==2026.2.28",
    "safetensors==0.7.0",
    "setuptools==82.0.1",
    "sympy==1.14.0",
    "tifffile==2026.3.3",
    "timm==1.0.25",
    "triton==3.3.1",
    "wcwidth==0.6.0",
]

[tool.hatch.build]
ignore-vcs = true
exclude = [
    "**/__pycache__/**",
    "**/*.py[cod]",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/node_modules/**",
    "**/*.tsbuildinfo",
    "viewer/web/dist/**",
]

[tool.hatch.build.targets.wheel]
packages = ["artisan", "pipeline", "sdk", "storage", "viewer"]
exclude = [
    "viewer/web/**",
    "**/__pycache__/**",
    "**/*.py[cod]",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/node_modules/**",
    "**/*.tsbuildinfo",
]

[tool.hatch.build.targets.wheel.force-include]
"viewer/web/dist" = "viewer/web/dist"
"THIRD_PARTY.md" = "artisan/THIRD_PARTY.md"

[tool.hatch.build.targets.sdist]
only-include = [
    "assets",
    "benchmark/README.md",
    "benchmark/Evaluation",
    "benchmark/run.py",
    "artisan",
    "pipeline",
    "sdk",
    "storage",
    "viewer",
    ".env.example",
    ".gitignore",
    ".python-version",
    "LICENSE",
    "NOTICE",
    "README.md",
    "THIRD_PARTY.md",
    "artisan.example.toml",
    "constraints.txt",
    "pyproject.toml",
    "uv.lock",
    "install.sh",
    "run.sh",
]

[dependency-groups]
dev = ["ruff==0.15.12"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"sdk/v0/*.py" = ["F401", "F403"]
"sdk/_core/v0/mesh.py" = ["F401"]
"sdk/_core/v0/testing.py" = ["F401"]
"sdk/_core/v0/_mesh/*.py" = ["F401", "F403", "F405", "F821"]
"sdk/_core/v0/_testing/*.py" = ["F401", "F403", "F405", "F821"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
